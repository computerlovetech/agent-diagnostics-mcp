[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-diagnostics-mcp"
version = "0.1.0"
description = "Agent self-diagnostics MCP server with FastAPI inspection UI"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.4",
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.46.0",
    "typer>=0.25.1",
]

[project.scripts]
agent-diagnostics = "agent_diagnostics_mcp.cli:main"
agent-diagnostics-hook-report = "agent_diagnostics_mcp.hooks.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_diagnostics_mcp"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ci.python]
versions = ["3.11", "3.12", "3.13", "3.14"]

[tool.ruff]
line-length = 100
